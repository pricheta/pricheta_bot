[project]
name = "telegram-bot"
version = "0.1.0"
description = "Pricheta's telegram bot"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.25.0",
    "dotenv>=0.9.9",
    "mypy>=1.19.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "pytest>=9.0.2",
    "pytest-coverage>=0.0",
    "ruff>=0.15.2",
]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = [
    "ANN201",  # Публичные функции
    "ANN202",  # Приватные функции
    "ANN204",  # Специальные методы (__init__ и др.)
    "ANN205",  # Статические методы
    "ANN206",  # Методы класса
]